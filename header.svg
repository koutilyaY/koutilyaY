<svg viewBox="0 0 1000 200" width="1000" height="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Koutilya Yenumula — Data & AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E1FB8"/>
      <stop offset="50%" stop-color="#C724B1"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6E1FB8" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1000" height="200" fill="url(#bg)"/>
  <rect width="1000" height="200" fill="url(#grid)"/>

  <!-- layered waves at the bottom -->
  <path d="M0 150 C 180 120, 320 185, 500 150 S 820 115, 1000 150 L1000 200 L0 200 Z" fill="url(#wave)"/>
  <path d="M0 170 C 200 145, 360 200, 540 168 S 840 140, 1000 168 L1000 200 L0 200 Z" fill="#0d1117" fill-opacity="0.35"/>

  <!-- name + title -->
  <text x="500" y="92" text-anchor="middle" font-family="'JetBrains Mono','Segoe UI',monospace" font-size="52" font-weight="700" fill="#ffffff" filter="url(#glow)" letter-spacing="1.5">Koutilya Yenumula</text>
  <text x="500" y="128" text-anchor="middle" font-family="'JetBrains Mono','Segoe UI',monospace" font-size="18" font-weight="500" fill="#eafcff" letter-spacing="3" opacity="0.95">DATA &amp; AI ENGINEER  ·  REAL-TIME PIPELINES  ·  AGENTIC ML SYSTEMS</text>
</svg>
